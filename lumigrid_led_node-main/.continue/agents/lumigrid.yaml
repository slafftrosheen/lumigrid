# LumiGrid Agent Configuration
# This file configures AI agents for the LumiGrid project

name: LumiGrid Development Agent
version: 1.0.0
schema: v1

# Context for agents working on this project
context:
  description: |
    LumiGrid is an ESP32-based LED controller firmware with a SvelteKit web UI.
    
    Key directories:
    - firmware/ - ESP-IDF project (C code)
    - webapp/ - SvelteKit web UI (Svelte/JS)
    - Docs/ - Documentation
    
    API endpoints defined in:
    - Docs/api_spec.yaml (OpenAPI spec)
    - webapp/src/lib/api.js (Frontend API wrapper)
    - firmware/components/rest_api/ (Backend handlers)

# Custom prompts for specific tasks
prompts:
  - name: fix-api-mismatch
    description: Align frontend API calls with backend endpoints
    content: |
      Check webapp/src/lib/api.js against firmware/components/rest_api/rest_api.c
      and Docs/api_spec.yaml to ensure all API endpoints match.
      
  - name: add-effect
    description: Add a new LED effect
    content: |
      Add a new effect to firmware/components/led_effects/effects.c.
      Follow the existing pattern for effect registration and rendering.
      
  - name: update-docs
    description: Update documentation
    content: |
      Update relevant documentation in Docs/ when making code changes.
      Ensure API changes are reflected in api_spec.yaml.
