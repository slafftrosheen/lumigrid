openapi: 3.1.0
info:
  title: LumiGrid LED Node API
  version: "1.0.0"
servers:
  - url: http://{host}
paths:
  /api/status:
    get:
      summary: Get node status
      responses:
        "200":
          description: OK
  /api/config:
    get:
      summary: Read configuration
      responses:
        "200":
          description: OK
    post:
      summary: Update configuration (partial allowed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Saved
  /api/presets:
    get:
      summary: List presets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
    post:
      summary: Create or update a preset
      description: Validates payload against preset-led.schema.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - preset_name
                - effect_id
              properties:
                preset_name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[a-zA-Z0-9_-]+$'
                  description: Unique preset identifier
                description:
                  type: string
                  maxLength: 256
                  description: Optional preset description
                effect_id:
                  type: integer
                  minimum: 1000
                  maximum: 9999
                  description: Effect identifier
                speed:
                  type: number
                  minimum: 0.0
                  maximum: 5.0
                  description: Effect speed
                intensity:
                  type: number
                  minimum: 0.0
                  maximum: 1.0
                  description: Effect intensity
                brightness:
                  type: number
                  minimum: 0.0
                  maximum: 1.0
                  description: Global brightness
                palette_id:
                  type: integer
                  minimum: 0
                  maximum: 255
                  description: Palette identifier
                color1:
                  type: array
                  description: Primary RGB color
                  items:
                    type: integer
                    minimum: 0
                    maximum: 255
                  minItems: 3
                  maxItems: 3
                color2:
                  type: array
                  description: Secondary RGB color
                  items:
                    type: integer
                    minimum: 0
                    maximum: 255
                  minItems: 3
                  maxItems: 3
                color3:
                  type: array
                  description: Tertiary RGB color
                  items:
                    type: integer
                    minimum: 0
                    maximum: 255
                  minItems: 3
                  maxItems: 3
            examples:
              ocean:
                value:
                  preset_name: "led_ocean"
                  description: "Smooth ocean wave effect"
                  effect_id: 1105
                  speed: 0.8
                  intensity: 1.0
                  palette_id: 1
                  color1: [0, 0, 255]
                  color2: [0, 100, 200]
                  color3: [0, 50, 150]
              fire:
                value:
                  preset_name: "fire_warm"
                  effect_id: 1104
                  speed: 0.8
                  intensity: 1.0
                  color1: [255, 40, 40]
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Validation error
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalid_field:
                  value: "effect_id=500 out of range [1000,9999]"
                missing_field:
                  value: "preset_name is required (string, non-empty)"
                invalid_color:
                  value: "color1 must have exactly 3 elements [R,G,B]"
  /api/presets/{name}:
    delete:
      summary: Delete preset
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /api/trigger:
    post:
      summary: One-shot action or bounded override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Executed
  /api/cue:
    post:
      summary: Apply a cue now or at absolute time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /events:
    get:
      summary: Server-sent events (playhead, telemetry)
      responses:
        "200":
          description: Event stream
  /api/discover/needs_sensor_data:
    get:
      summary: Check if this LED node accepts sensor data
      responses:
        "200":
          description: Node sensor data requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  needs_data:
                    type: boolean
                    description: Whether this node accepts sensor data
                  types:
                    type: array
                    items:
                      type: string
                    description: List of supported sensor types
              example:
                needs_data: true
                types: ["temperature", "humidity", "motion", "light"]
  /api/sensor_update:
    post:
      summary: Receive sensor data from sensor nodes
      description: LED nodes can receive sensor data to trigger temperature-reactive effects, motion-triggered sequences, or ambient light-based brightness adjustments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                node_id:
                  type: string
                  description: ID of the sensor node sending the data
                timestamp:
                  type: integer
                  description: Unix timestamp when the data was collected
                readings:
                  type: object
                  properties:
                    temperature_c:
                      type: number
                      description: Temperature in Celsius
                    humidity_percent:
                      type: number
                      description: Relative humidity percentage
                    motion_detected:
                      type: boolean
                      description: Whether motion was detected
                    light_level:
                      type: number
                      description: Ambient light level
            example:
              node_id: "sensor_node_01"
              timestamp: 1678886400
              readings:
                temperature_c: 23.5
                humidity_percent: 55.2
                motion_detected: true
      responses:
        "200":
          description: Sensor data received successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
  /api/ota/upload:
    post:
      summary: Upload firmware binary for OTA update
      description: Upload a compiled firmware binary (.bin) for over-the-air update. Device will reboot after successful upload. Supports automatic rollback on failed boot.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Firmware uploaded successfully, device will reboot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        "500":
          description: OTA update failed
  /api/ota/url:
    post:
      summary: Download firmware from URL for OTA update
      description: Download firmware binary from a URL and perform OTA update. Device will reboot after successful download and verification.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "http://example.com/firmware.bin"
      responses:
        "200":
          description: Firmware download initiated, device will reboot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        "400":
          description: Invalid URL
        "500":
          description: Download or OTA update failed
