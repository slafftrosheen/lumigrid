<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LumiGrid LED Node</title>
<style>
/* LumiGrid Design System - Design Tokens */
:root{
  --bg:#0f1115; --surface:#151924; --muted:#1c2232; --text:#e6eaf2; --subtext:#9BA7C0;
  --primary:#6C7CFF; --primary-600:#5366ff; --primary-700:#4256f3;
  --accent:#86E2FF; --danger:#ff5c7a; --warn:#ffc857; --success:#38e1b3;
  --focus:#86E2FF;
  --ring:0 0 0 .16rem var(--focus),0 0 0 .28rem color-mix(in oklab,var(--focus) 30%,transparent);
  --radius:14px; --radius-sm:10px;
  --shadow-md:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 2px 10px rgba(0,0,0,.25);
  --gap:14px;
  font-family:system-ui,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:linear-gradient(180deg,var(--surface),color-mix(in oklab,var(--surface) 80%,transparent));border-bottom:1px solid #20263a}
h1{font-size:18px;margin:0;font-weight:700}
.pill{font-size:12px;padding:6px 10px;background:var(--muted);border-radius:999px;color:var(--subtext);display:inline-flex;align-items:center;gap:8px}
main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;gap:var(--gap);grid-template-columns:1.2fr 1fr}
.card{background:var(--surface);border:1px solid #20263a;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-md)}
.card h2{margin:0 0 12px;font-size:16px;color:var(--text)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row input[type="number"]{width:72px}
.btn{all:unset;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--primary);color:white;cursor:pointer;box-shadow:var(--shadow-sm)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn.primary{background:var(--primary)}
.btn.ghost{background:transparent;border:1px solid #2a3248;color:var(--text)}
.btn.danger{background:var(--danger);color:white}
.grid{display:grid;gap:8px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed #2a3248;padding:6px 0;color:var(--subtext)}
input,select{background:var(--muted);border:1px solid #2a3248;border-radius:var(--radius-sm);color:var(--text);padding:10px 12px}
input:focus-visible,select:focus-visible{outline:none;box-shadow:var(--ring)}
hr{border:none;border-top:1px solid #20263a;margin:10px 0}
.badge{display:inline-block;padding:4px 8px;border:1px solid #2a3248;border-radius:8px;font-size:12px;color:var(--subtext);background:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.item{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid #2a3248;border-radius:var(--radius-sm);background:var(--muted)}
.flex{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<header>
  <h1>🌈 LumiGrid LED Node</h1>
  <div class="pill" id="statusPill">disconnected…</div>
</header>
<main>
  <section class="card">
    <h2>Status</h2>
    <div id="status"></div>
    <hr/>
    <div class="flex">
      <button class="btn" id="btnSelf">Self-Test</button>
      <button class="btn danger" id="btnBlack">Blackout</button>
      <button class="btn ghost" id="btnRefresh">Refresh</button>
    </div>
  </section>

  <section class="card">
    <h2>PWM Groups</h2>
    <div id="groupsList" class="list"></div>
    <div class="row">
      <button class="btn primary" id="btnAddGroup">Add Group</button>
      <button class="btn" id="btnSaveGroups">Save</button>
    </div>
  </section>

  <section class="card">
    <h2>Presets</h2>
    <div id="presetList" class="list"></div>
    <div class="row">
      <input id="presetName" placeholder="new-preset.json"/>
      <button class="btn" id="btnSaveSnapshot">Save snapshot</button>
    </div>
  </section>

  <section class="card">
    <h2>Scheduler</h2>
    <div class="grid cols-2">
      <div class="row">
        <select id="cuePreset"></select>
      </div>
      <div class="row">
        <input id="cueWhen" type="datetime-local"/>
      </div>
    </div>
    <div class="row">
      <label>Fade (ms)</label>
      <input id="cueFade" type="number" value="300"/>
      <button class="btn primary" id="btnSchedule">Schedule</button>
    </div>
    <div class="kv"><span>Active preset</span><strong id="activePreset">—</strong></div>
    <div class="kv"><span>Fade remaining</span><strong id="fadeRemain">0 ms</strong></div>
  </section>

  <section class="card">
    <h2>FX Editor</h2>
    <div class="row">
      <label>Channel</label>
      <select id="fxCh"></select>
      <label>Effect</label>
      <select id="fxId"></select>
    </div>
    <div class="grid cols-3">
      <div class="row">
        <label>Speed</label>
        <input id="fxSpeed" type="range" min="0" max="3" step="0.01" value="1">
        <span id="fxSpeedVal">1.00</span>
      </div>
      <div class="row">
        <label>Intensity</label>
        <input id="fxInt" type="range" min="0" max="1" step="0.01" value="1">
        <span id="fxIntVal">1.00</span>
      </div>
      <div class="row">
        <label>Palette</label>
        <input id="fxPal" type="number" min="0" max="8" value="0">
      </div>
    </div>
    <div class="row">
      <label>Color1</label>
      <input id="fxC1" type="color" value="#ffa040">
      <button class="btn primary" id="btnFxApply">Apply</button>
    </div>
  </section>
</main>

<script>
const $ = sel => document.querySelector(sel);
const api = (u, opt={}) => fetch(u,opt);
const post = (u, body) => api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

async function loadStatus(){
  const r = await api('/api/status'); const j = await r.json();
  $('#statusPill').textContent = 'online';
  const el = $('#status'); el.innerHTML='';
  const a = document.createElement('div');
  a.className='grid cols-2';
  (j.aled||[]).forEach(ch=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div>
      <div><strong>ALED ${ch.ch}</strong> <span class="badge">${ch.type}</span> <span class="badge">${ch.order}</span></div>
      <div class="kv"><span>pixels</span><span>${ch.pixels}</span></div></div>`;
    a.appendChild(d);
  });
  el.appendChild(a);
  const pg = document.createElement('div'); pg.className='grid cols-2';
  (j.pwm_groups||[]).forEach(g=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div><strong>${g.name}</strong> <span class="badge">${g.kind}</span></div>
                 <div class="flex">
                   <button class="btn" onclick="bumpGroup('${g.name}','${g.kind}')">Bump</button>
                 </div>`;
    pg.appendChild(d);
  });
  el.appendChild(document.createElement('hr')); el.appendChild(pg);
}

async function bumpGroup(name, kind){
  const payload = {action:'set_pwm_group', name, r:1,g:1,b:1};
  if (kind==='RGBW') payload.w=1;
  await post('/api/trigger', payload);
  setTimeout(()=>post('/api/trigger',{action:'set_pwm_group',name,r:0,g:0,b:0,w:0}), 300);
}

async function loadConfig(){ const r=await api('/api/config'); return r.json(); }
async function saveConfig(cfg){ await post('/api/config', cfg); }

function renderGroups(cfg){
  const root = $('#groupsList'); root.innerHTML='';
  (cfg.pwm_groups||[]).forEach((g,i)=>{
    const row=document.createElement('div'); row.className='item';
    row.innerHTML = `
      <div class="flex">
        <input value="${g.name}" size="10" data-k="name" data-i="${i}">
        <select data-k="kind" data-i="${i}">
          <option ${g.kind==='RGB'?'selected':''}>RGB</option>
          <option ${g.kind==='RGBW'?'selected':''}>RGBW</option>
        </select>
        <span>r:<input type="number" value="${g.map?.r??0}" min="0" max="15" data-k="map.r" data-i="${i}"></span>
        <span>g:<input type="number" value="${g.map?.g??1}" min="0" max="15" data-k="map.g" data-i="${i}"></span>
        <span>b:<input type="number" value="${g.map?.b??2}" min="0" max="15" data-k="map.b" data-i="${i}"></span>
        <span>w:<input type="number" value="${g.map?.w??3}" min="0" max="15" data-k="map.w" data-i="${i}"></span>
      </div>
      <button class="btn danger" data-del="${i}">Delete</button>`;
    root.appendChild(row);
  });
}

async function refreshGroups(){
  const cfg = await loadConfig(); renderGroups(cfg);
}

$('#groupsList').addEventListener('change', async (e)=>{
  const i = +e.target.dataset.i; const k = e.target.dataset.k; if (isNaN(i)||!k) return;
  const cfg = await loadConfig(); cfg.pwm_groups = cfg.pwm_groups||[];
  const g = cfg.pwm_groups[i] || (cfg.pwm_groups[i]={name:'Group'+(i+1),kind:'RGB',map:{r:0,g:1,b:2}});
  if (k==='name') g.name = e.target.value;
  else if (k==='kind') g.kind = e.target.value;
  else {
    const [_, ch] = k.split('.');
    g.map = g.map||{};
    g.map[ch] = Number(e.target.value);
  }
  await saveConfig(cfg);
});

$('#groupsList').addEventListener('click', async (e)=>{
  if (!e.target.dataset.del) return;
  const i = +e.target.dataset.del;
  const cfg = await loadConfig();
  cfg.pwm_groups.splice(i,1);
  await saveConfig(cfg); await refreshGroups();
});

$('#btnAddGroup').onclick = async ()=>{
  const cfg = await loadConfig();
  cfg.pwm_groups = cfg.pwm_groups||[];
  cfg.pwm_groups.push({name:`Group${cfg.pwm_groups.length+1}`,kind:'RGB',map:{r:0,g:1,b:2}});
  await saveConfig(cfg); await refreshGroups();
};
$('#btnSaveGroups').onclick = refreshGroups;

async function loadPresets(){
  const r=await api('/api/presets'); const arr=await r.json();
  const list=$('#presetList'); list.innerHTML='';
  const sel=$('#cuePreset'); sel.innerHTML='';
  arr.forEach(name=>{
    const item=document.createElement('div'); item.className='item';
    item.innerHTML=`<div>${name}</div>
    <div class="flex">
      <button class="btn" data-apply="${name}">Apply</button>
      <button class="btn danger" data-del="${name}">Delete</button>
    </div>`;
    list.appendChild(item);
    const opt=document.createElement('option'); opt.value=name; opt.textContent=name; sel.appendChild(opt);
  });
}
$('#presetList').addEventListener('click', async (e)=>{
  if (e.target.dataset.apply){
    await post('/api/presets/apply',{name:e.target.dataset.apply, fade_ms:300});
  }
  if (e.target.dataset.del){
    await api('/api/presets?name='+encodeURIComponent(e.target.dataset.del),{method:'DELETE'});
    await loadPresets();
  }
});

$('#btnSaveSnapshot').onclick = async ()=>{
  const name = $('#presetName').value.trim() || ('snapshot-'+Date.now()+'.json');
  // ask status + config to compose a simple snapshot
  const st = await (await api('/api/status')).json();
  const snap = { name, aled: st.aled.map(a=>({ch:a.ch, color:[0,0,0]})), pwm_groups: (st.pwm_groups||[]).map(g=>({name:g.name, level:{r:0,g:0,b:0,w:0}})) };
  await post('/api/presets', snap); await loadPresets();
};

$('#btnSchedule').onclick = async ()=>{
  const name = $('#cuePreset').value;
  const fade = +$('#cueFade').value||0;
  const when = new Date($('#cueWhen').value).getTime();
  await post('/api/cue',{name, at_ms: when, fade_ms: fade});
};

async function pollActive(){
  try {
    const r=await api('/api/active'); const j=await r.json();
    $('#activePreset').textContent = j.preset || '—';
    $('#fadeRemain').textContent = (j.fade_ms|0) + ' ms';
  } catch(e){}
}
setInterval(pollActive, 500);

async function loadEffects(){
  const r = await api('/api/effects'); const arr = await r.json();
  const sel = $('#fxId'); sel.innerHTML='';
  arr.forEach(e => {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = `${e.id} · ${e.name}`;
    sel.appendChild(o);
  });
}

async function populateChannels(){
  const st = await (await api('/api/status')).json();
  const sel = $('#fxCh'); sel.innerHTML='';
  (st.aled||[]).forEach(a=>{
    const o = document.createElement('option');
    o.value = a.ch; o.textContent = `ALED ${a.ch} (${a.pixels} px)`;
    sel.appendChild(o);
  });
}

function hexToRgbw(hex){
  const v = hex.replace('#','');
  const r = parseInt(v.substring(0,2),16);
  const g = parseInt(v.substring(2,4),16);
  const b = parseInt(v.substring(4,6),16);
  return [r,g,b]; // let backend compute W if RGBW strip is used
}

$('#fxSpeed').oninput = () => $('#fxSpeedVal').textContent = (+$('#fxSpeed').value).toFixed(2);
$('#fxInt').oninput   = () => $('#fxIntVal').textContent   = (+$('#fxInt').value).toFixed(2);

$('#btnFxApply').onclick = async ()=>{
  const ch  = +$('#fxCh').value;
  const fx  = +$('#fxId').value;
  const spd = +$('#fxSpeed').value;
  const it  = +$('#fxInt').value;
  const pal = +$('#fxPal').value;
  const c1  = hexToRgbw($('#fxC1').value);
  await post('/api/aled/effect', { ch, effect_id: fx, speed: spd, intensity: it, palette_id: pal, color1: c1 });
};

$('#btnSelf').onclick = ()=>post('/api/trigger',{action:'self_test'});
$('#btnBlack').onclick = ()=>post('/api/trigger',{action:'blackout'});
$('#btnRefresh').onclick = ()=>{ loadStatus(); refreshGroups(); loadPresets(); };

(async function init(){
  await populateChannels();
  await loadEffects();
  await loadStatus(); await refreshGroups(); await loadPresets(); pollActive();
  // ensure dirs on first connect (server side also ensures, but harmless)
  await api('/api/status');
})();
</script>
</body>
</html>
