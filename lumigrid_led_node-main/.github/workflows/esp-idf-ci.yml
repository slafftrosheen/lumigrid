name: ESP-IDF CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package.json

      - name: Build webapp
        run: |
          cd webapp
          npm ci
          npm run build
          # Deploy to firmware assets
          rm -rf ../firmware/assets/webapp/*
          cp -r build/* ../firmware/assets/webapp/

      - name: Build firmware with ESP-IDF v5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          path: firmware
          command: idf.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
          retention-days: 7

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Unity tests
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          path: firmware
          command: idf.py build test

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for format string issues
        run: |
          echo "Checking for potential format string vulnerabilities..."
          # Check for printf-family functions with user-controlled format strings
          if grep -rn --include="*.c" --include="*.h" 'printf.*%s.*%' firmware/ | grep -v '//'; then
            echo "Warning: Potential format string issues found"
          fi

      - name: Check for single-byte buffers
        run: |
          echo "Checking for single-byte buffer declarations..."
          if grep -rn --include="*.c" --include="*.h" 'char.*\[1\]' firmware/ | grep -v '//'; then
            echo "Error: Single-byte buffers found (use larger buffers)"
            exit 1
          fi

      - name: Validate CMakeLists structure
        run: |
          echo "Checking CMakeLists.txt files..."
          find firmware -name "CMakeLists.txt" -exec echo "Found: {}" \;
          
      - name: Check for TODO and FIXME comments
        run: |
          echo "Checking for TODO and FIXME markers..."
          grep -rn --include="*.c" --include="*.h" -E "TODO|FIXME" firmware/ || echo "No pending TODOs found"
