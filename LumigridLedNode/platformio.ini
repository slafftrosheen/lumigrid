; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = factory
src_dir = main

[env:factory]
platform = espressif32@6.7.0
board = esp32dev
framework = espidf
board_build.partitions = partitions.factory.csv
extra_scripts = pre:scripts/pre_build.py
build_flags = -DCONFIG_LUMIGRID_ENABLE_DEV_CREDENTIALS=1
monitor_speed = 115200
upload_speed = 115200

[env:test]
platform = espressif32@6.7.0
board = esp32dev
framework = espidf
board_build.partitions = partitions.factory.csv
extra_scripts = pre:scripts/pre_build.py
build_flags = -DCONFIG_LUMIGRID_ENABLE_RUNTIME_TESTS=1
monitor_speed = 115200
upload_speed = 115200