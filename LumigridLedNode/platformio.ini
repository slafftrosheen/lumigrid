; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = factory
src_dir = main

[env:factory]
platform = espressif32@6.7.0
board = esp32dev
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
framework = espidf
board_build.partitions = partitions.factory.csv
extra_scripts = pre:scripts/pre_build.py
monitor_speed = 115200
upload_speed = 115200
upload_port = COM3

[env:test]
platform = espressif32@6.7.0
board = esp32dev
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
framework = espidf
board_build.partitions = partitions.factory.csv
extra_scripts = pre:scripts/pre_build.py
build_flags = -DCONFIG_LUMIGRID_ENABLE_RUNTIME_TESTS=1 -DCONFIG_LUMIGRID_ENABLE_DEV_CREDENTIALS=1 -Os -fstack-usage
monitor_speed = 115200
upload_speed = 115200
upload_port = COM3

[env:rollback-test]
extends = env:factory
build_flags = -DCONFIG_LUMIGRID_OTA_ROLLBACK_TEST=1
board_build.cmake_extra_args = -DPROJECT_VER=1.0.0-lg0384rb
