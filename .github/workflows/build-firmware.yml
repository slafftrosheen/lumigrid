name: Build Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'LumigridLedNode/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Firmware
        run: |
          cd LumigridLedNode
          pio run -e factory

      - name: Merge Binaries
        run: |
          cd LumigridLedNode
          esptool.py --chip esp32 merge_bin -o merged_firmware.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 .pio/build/factory/bootloader.bin 0x8000 .pio/build/factory/partitions.bin 0x10000 .pio/build/factory/firmware.bin

      - name: Prepare Latest Builds
        run: |
          mkdir -p lumigrid-lander-main/static/latest_builds
          cp LumigridLedNode/merged_firmware.bin lumigrid-lander-main/static/latest_builds/
          cp LumigridLedNode/.pio/build/factory/firmware.bin lumigrid-lander-main/static/latest_builds/

      - name: Commit and Push Firmware
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-build latest firmware binaries [skip ci]"
          file_pattern: 'lumigrid-lander-main/static/latest_builds/*.bin'
