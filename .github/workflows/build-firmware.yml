name: "Build & Test Firmware"

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-build:
    name: Firmware Build (PlatformIO / ESP-IDF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure PlatformIO directory
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/lumigrid-platformio" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for embedded dashboard generation
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lumigrid-lander-main/package-lock.json

      - name: Install firmware and locked embedded dashboard dependencies
        run: |
          python -m pip install platformio==6.2.0
          npm ci --prefix lumigrid-lander-main

      - name: Static Architecture & Lifecycle Sanity Checks
        run: |
          echo "=== Checking runtime lifecycle and architectural invariants ==="
          # 1. No ESP_ERROR_CHECK in runtime lifecycle code
          if grep -rn "ESP_ERROR_CHECK(" LumigridLedNode/main/LumigridRuntime.cpp LumigridLedNode/components/signage/LightingRuntime.cpp LumigridLedNode/components/factory/FactoryRunner.cpp; then
            echo "ERROR: Found forbidden ESP_ERROR_CHECK in runtime lifecycle code!"
            exit 1
          fi
          # 2. No uncontrolled external vTaskDelete targeting runtime tasks (only vTaskDelete(NULL) permitted)
          if grep -rn "vTaskDelete(" LumigridLedNode/components/signage/LightingRuntime.cpp LumigridLedNode/components/factory/FactoryRunner.cpp | grep -v "vTaskDelete(NULL)"; then
            echo "ERROR: Found uncontrolled external vTaskDelete targeting runtime tasks!"
            exit 1
          fi
          # 3. No static bool services_started
          if grep -rn "static bool services_started" LumigridLedNode/; then
            echo "ERROR: Found process-global static bool services_started!"
            exit 1
          fi
          # 4. No hardcoded development password in network component definitions
          if grep -rn "lumigrid123" LumigridLedNode/components/network/; then
            echo "ERROR: Found hardcoded development password in network component definitions!"
            exit 1
          fi
          # 5. Dedicated invariant checker
          python LumigridLedNode/scripts/test_boot_config.py
          python LumigridLedNode/scripts/test_boot_stack.py
          python LumigridLedNode/scripts/test_partition_layout.py
          python LumigridLedNode/scripts/test_firmware_release_manifest.py
          python LumigridLedNode/scripts/test_output_drivers.py
          python LumigridLedNode/scripts/test_effects.py
          python LumigridLedNode/scripts/test_effect_catalog_api.py
          python LumigridLedNode/scripts/test_wifi_recovery.py
          python LumigridLedNode/scripts/test_config_strings.py
          python LumigridLedNode/scripts/test_config_persistence.py
          python LumigridLedNode/scripts/test_backup_recovery.py
          python LumigridLedNode/scripts/test_restore_transaction.py
          python LumigridLedNode/scripts/test_runtime_recovery.py
          python LumigridLedNode/scripts/test_control_jobs.py
          python LumigridLedNode/scripts/test_factory_jobs.py
          python LumigridLedNode/scripts/test_factory_cancellation_api.py
          python LumigridLedNode/scripts/test_lighting_state.py
          python LumigridLedNode/scripts/test_ota_boot_verifier.py
          python LumigridLedNode/scripts/test_ota_upload.py
          python LumigridLedNode/scripts/test_board_bootstrap.py
          python LumigridLedNode/scripts/test_certification_service.py
          python LumigridLedNode/scripts/test_certification_api.py
          python LumigridLedNode/scripts/test_certification_store.py
          python LumigridLedNode/scripts/check_invariants.py
          # 6. Runtime mathematical and protocol simulation tests
          python LumigridLedNode/scripts/verify_runtime_math.py
          echo "=== Static Architecture & Lifecycle Sanity Checks PASSED ==="

      # The project uses PlatformIO with the official ESP-IDF framework (espressif32 @ 6.7.0, ESP-IDF 5.2.1)
      # and pre_build.py to generate production dashboard headers from dashboard.html.
      - name: Build Firmware (Factory and Test environments)
        id: pio_build
        run: |
          cd LumigridLedNode
          echo "=== Building Factory Environment ==="
          pio run -e factory
          python scripts/check_invariants.py
          echo "=== Building Test Environment ==="
          pio run -e test

      - name: Firmware Build Success Status
        if: success()
        run: |
          echo "=================================================="
          echo "BUILD PASSED: Firmware compilation successful."
          echo "=================================================="

      - name: Firmware Build Failure Status
        if: failure()
        run: |
          echo "=================================================="
          echo "BUILD FAILED: Firmware compilation failed."
          echo "=================================================="
          exit 1

      - name: Merge Binaries
        run: |
          cd LumigridLedNode
          python "$PLATFORMIO_CORE_DIR/packages/tool-esptoolpy/esptool.py" --chip esp32 merge_bin -o .pio/build/merged_firmware.bin --flash_mode dio --flash_freq 40m --flash_size 8MB 0x1000 .pio/build/factory/bootloader.bin 0x8000 .pio/build/factory/partitions.bin 0x10000 .pio/build/factory/firmware.bin

      - name: Validate and package traceable firmware candidate
        run: |
          python LumigridLedNode/scripts/firmware_release_manifest.py \
            --merged-firmware LumigridLedNode/.pio/build/merged_firmware.bin \
            --output LumigridLedNode/.pio/release-candidate

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumigrid-firmware-candidate-${{ github.sha }}
          path: LumigridLedNode/.pio/release-candidate/
          if-no-files-found: error
          include-hidden-files: true

  web-build:
    name: Web Application Build (SvelteKit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd lumigrid-lander-main
          npm ci

      - name: Build SvelteKit Web App
        run: |
          cd lumigrid-lander-main
          npm run build

      - name: Web Build Success Status
        if: success()
        run: |
          echo "=================================================="
          echo "BUILD PASSED: Web application build successful."
          echo "=================================================="

      - name: Web Build Failure Status
        if: failure()
        run: |
          echo "=================================================="
          echo "BUILD FAILED: Web application build failed."
          echo "=================================================="
          exit 1
